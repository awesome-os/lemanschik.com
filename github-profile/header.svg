<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Frank Lemanschik — Sectium (Core), B8G (Additions &amp; Toolchains), StealifyLang (Algebraic Frontend)">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0d1324"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="prism" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="33%" stop-color="#a371f7"/>
      <stop offset="66%" stop-color="#f778ba"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="glowL" cx="22%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="82%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowL)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowR)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#232d3b" stroke-width="2"/>

  <!-- Top prism bar -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#prism)"/>

  <!-- Right-side geometric intersection emblem (3-Pillar Zero-Copy Architecture) -->
  <g transform="translate(970, 160)" opacity="0.92">
    <circle cx="-46" cy="-16" r="68" fill="none" stroke="#58a6ff" stroke-width="2.2" stroke-opacity="0.75"/>
    <circle cx="46" cy="-16" r="68" fill="none" stroke="#a371f7" stroke-width="2.2" stroke-opacity="0.75"/>
    <circle cx="0" cy="48" r="68" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-opacity="0.8"/>
    <circle cx="0" cy="8" r="19" fill="url(#prism)" opacity="0.88"/>
    <circle cx="0" cy="8" r="32" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.65"/>
    <text x="0" y="12.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#070a14">B8G</text>
    <text x="-70" y="-94" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#79c0ff">Sectium (Core)</text>
    <text x="72" y="-94" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#d2a8ff">StealifyLang</text>
    <text x="0" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#3fb950">B8G · B8G_ARENA_V1 · O(1)</text>
  </g>

  <!-- Subtle starry sparkles -->
  <circle cx="820" cy="58" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="1115" cy="72" r="2.2" fill="#58a6ff" opacity="0.8"/>
  <circle cx="850" cy="255" r="1.8" fill="#3fb950" opacity="0.8"/>
  <circle cx="1132" cy="240" r="2" fill="#f778ba" opacity="0.75"/>

  <!-- Left typography -->
  <g transform="translate(56, 74)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.2" fill="#58a6ff" font-weight="600">ALGEBRAIC ABI-DRIVEN OS ARCHITECTURE · AWESOME-OS</text>
    <text x="0" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#f0f6fc" letter-spacing="-1">Frank Lemanschik</text>
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#c9d1d9">
      Creator of <tspan fill="#ffffff" font-weight="700">Intersection-Oriented Computing</tspan> &amp; Sovereign Zero-Copy Systems
    </text>
    <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#8b949e">
      <tspan fill="#79c0ff" font-weight="600">Sectium (Core)</tspan> · <tspan fill="#3fb950" font-weight="600">B8G (Additions &amp; Toolchains)</tspan> · <tspan fill="#d2a8ff" font-weight="600">StealifyLang (Algebraic Frontend)</tspan>
    </text>

    <!-- Crisp badge pills -->
    <g transform="translate(0, 158)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
      <rect x="0" y="0" width="144" height="30" rx="15" fill="#132219" stroke="#3fb950" stroke-opacity="0.6"/>
      <text x="72" y="19.5" text-anchor="middle" fill="#3fb950" font-weight="600">v8/AUTHORS:154</text>

      <rect x="156" y="0" width="166" height="30" rx="15" fill="#121a28" stroke="#58a6ff" stroke-opacity="0.55"/>
      <text x="239" y="19.5" text-anchor="middle" fill="#79c0ff" font-weight="600">lemanschik.com</text>

      <rect x="334" y="0" width="172" height="30" rx="15" fill="#1a1426" stroke="#a371f7" stroke-opacity="0.55"/>
      <text x="420" y="19.5" text-anchor="middle" fill="#d2a8ff" font-weight="600">awesome-os.com</text>

      <rect x="518" y="0" width="214" height="30" rx="15" fill="#141b24" stroke="#30363d"/>
      <text x="625" y="19.5" text-anchor="middle" fill="#c9d1d9">The White Dragon Book</text>
    </g>
  </g>
</svg>
